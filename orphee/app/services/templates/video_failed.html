<!doctype html>
<html
  lang="fr"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="color-scheme"
      content="dark light"
    />
    <meta
      name="supported-color-schemes"
      content="dark light"
    />
    <title>Le rendu a échoué</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
      <style>
        table,
        td {
          border-collapse: collapse;
        }
        * {
          font-family: Arial, Helvetica, sans-serif !important;
        }
      </style>
    <![endif]-->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        height: 100% !important;
      }

      a.vx-btn {
        transition: opacity 0.15s ease;
      }
      a.vx-btn:hover {
        opacity: 0.88;
      }
      a.vx-link:hover {
        text-decoration: underline !important;
      }

      @media screen and (max-width: 600px) {
        .vx-container {
          width: 100% !important;
        }
        .vx-px {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
        .vx-py {
          padding-top: 32px !important;
          padding-bottom: 32px !important;
        }
        .vx-h1 {
          font-size: 24px !important;
          line-height: 1.2 !important;
        }
        .vx-row-stack td {
          display: block !important;
          width: 100% !important;
          text-align: left !important;
          padding-bottom: 2px !important;
        }
      }

      /* Dark is the default look (below); light-mode clients get overridden here.
     Clients that don't understand prefers-color-scheme simply keep dark. */
      @media (prefers-color-scheme: light) {
        .vx-page {
          background-color: #f5f4f0 !important;
        }
        .vx-card {
          background-color: #ffffff !important;
          border-color: #e7e5df !important;
        }
        .vx-card-soft {
          background-color: #faf9f6 !important;
          border-color: #e7e5df !important;
        }
        .vx-border {
          border-color: #e7e5df !important;
        }
        .vx-fg {
          color: #17171a !important;
        }
        .vx-muted {
          color: #6b6a66 !important;
        }
        .vx-muted-dim {
          color: #9a9994 !important;
        }
        .vx-accent-error {
          color: #dc2626 !important;
        }
        .vx-dot-error {
          background-color: #dc2626 !important;
        }
        .vx-error-box {
          background-color: #fef2f2 !important;
          border-color: #f5c6c6 !important;
        }
        .vx-error-label {
          color: #b91c1c !important;
        }
        .vx-error-text {
          color: #7f1d1d !important;
        }
        .vx-btn-bg {
          background-color: #17171a !important;
        }
        .vx-btn-fg {
          color: #ffffff !important;
        }
      }
    </style>
  </head>
  <body
    class="vx-page"
    style="
      margin: 0;
      padding: 0;
      background-color: #121212;
      font-family:
        &quot;Inter&quot;,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    "
  >
    <!-- Preheader (hidden preview text) -->
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        mso-hide: all;
        font-size: 1px;
        line-height: 1px;
        color: #121212;
      "
    >
      La génération de ta vidéo a échoué — voici ce qui s'est passé.
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="vx-page"
      style="background-color: #121212"
    >
      <tr>
        <td
          align="center"
          class="vx-py"
          style="padding: 48px 16px"
        >
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="vx-container"
            style="width: 600px; max-width: 600px"
          >
            <!-- Wordmark -->
            <tr>
              <td
                align="center"
                style="padding-bottom: 28px"
              >
                <span
                  class="vx-fg"
                  style="
                    font-size: 18px;
                    font-weight: 800;
                    letter-spacing: -0.02em;
                    color: #f5f5f5;
                    text-transform: uppercase;
                  "
                  >Vexia</span
                ><span
                  style="
                    display: inline-block;
                    width: 5px;
                    min-width: 5px;
                    min-height: 5px;
                    height: 5px;
                    margin-left: 4px;
                    margin-bottom: 8px;
                    border-radius: 50%;
                    background-color: #a78bfa;
                    vertical-align: top;
                  "
                  >&nbsp;</span
                >
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td
                class="vx-card"
                style="
                  background-color: #1e1e1e;
                  border: 1px solid #313131;
                  border-radius: 24px;
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      class="vx-px"
                      style="padding: 48px 48px 40px 48px"
                      align="center"
                    >
                      <!-- Badge -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="margin: 0 auto 20px auto"
                      >
                        <tr>
                          <td
                            class="vx-border"
                            style="
                              border: 1px solid #313131;
                              border-radius: 999px;
                              padding: 6px 14px;
                            "
                          >
                            <span
                              class="vx-dot-error"
                              style="
                                display: inline-block;
                                width: 6px;
                                min-width: 6px;
                                min-height: 6px;
                                height: 6px;
                                margin-right: 8px;
                                border-radius: 50%;
                                background-color: #f87171;
                                vertical-align: middle;
                              "
                              >&nbsp;</span
                            ><span
                              class="vx-muted"
                              style="
                                font-size: 12px;
                                font-weight: 500;
                                color: #a3a3a3;
                                vertical-align: middle;
                              "
                              >Erreur</span
                            >
                          </td>
                        </tr>
                      </table>

                      <!-- Heading -->
                      <div
                        class="vx-h1 vx-fg"
                        style="
                          font-size: 28px;
                          line-height: 1.2;
                          font-weight: 700;
                          letter-spacing: -0.02em;
                          color: #f5f5f5;
                          margin: 0 0 12px 0;
                        "
                      >
                        Le rendu a
                        <span
                          class="vx-accent-error"
                          style="color: #f87171"
                          >échoué</span
                        >
                      </div>

                      <!-- Subtitle -->
                      <p
                        class="vx-muted"
                        style="
                          margin: 0 0 32px 0;
                          font-size: 15px;
                          line-height: 1.6;
                          color: #a3a3a3;
                        "
                      >
                        La génération de « {{job_title}} » n'a pas pu aboutir.
                        <!-- Aucun crédit ne t'a été décompté pour ce rendu. -->
                      </p>

                      <!-- Meta row -->
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        class="vx-card-soft"
                        style="
                          background-color: #262626;
                          border: 1px solid #313131;
                          border-radius: 16px;
                          margin-bottom: 16px;
                        "
                      >
                        <tr>
                          <td style="padding: 6px 20px">
                            <table
                              role="presentation"
                              width="100%"
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              class="vx-row-stack"
                            >
                              <tr>
                                <td
                                  class="vx-border vx-muted"
                                  style="
                                    padding: 14px 0;
                                    border-bottom: 1px solid #313131;
                                    font-size: 13px;
                                    color: #a3a3a3;
                                  "
                                >
                                  Titre
                                </td>
                                <td
                                  class="vx-border vx-fg"
                                  style="
                                    padding: 14px 0;
                                    border-bottom: 1px solid #313131;
                                    font-size: 13px;
                                    color: #f5f5f5;
                                    font-weight: 600;
                                    text-align: right;
                                  "
                                >
                                  {{job_title}}
                                </td>
                              </tr>
                            </table>
                            <table
                              role="presentation"
                              width="100%"
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              class="vx-row-stack"
                            >
                              <tr>
                                <td
                                  class="vx-border vx-muted"
                                  style="
                                    padding: 14px 0;
                                    border-bottom: 1px solid #313131;
                                    font-size: 13px;
                                    color: #a3a3a3;
                                  "
                                >
                                  Extraits
                                </td>
                                <td
                                  class="vx-border vx-fg"
                                  style="
                                    padding: 14px 0;
                                    border-bottom: 1px solid #313131;
                                    font-size: 13px;
                                    color: #f5f5f5;
                                    font-weight: 600;
                                    text-align: right;
                                  "
                                >
                                  {{clip_count}}
                                </td>
                              </tr>
                            </table>
                            <table
                              role="presentation"
                              width="100%"
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              class="vx-row-stack"
                            >
                              <tr>
                                <td
                                  class="vx-muted"
                                  style="
                                    padding: 14px 0;
                                    font-size: 13px;
                                    color: #a3a3a3;
                                  "
                                >
                                  Modèle
                                </td>
                                <td
                                  class="vx-fg"
                                  style="
                                    padding: 14px 0;
                                    font-size: 13px;
                                    color: #f5f5f5;
                                    font-weight: 600;
                                    text-align: right;
                                    text-transform: capitalize;
                                  "
                                >
                                  {{template}}
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>

                      <!-- Error details -->
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        class="vx-error-box"
                        style="
                          background-color: #3a1717;
                          border: 1px solid #5c2626;
                          border-radius: 16px;
                          margin-bottom: 32px;
                        "
                      >
                        <tr>
                          <td style="padding: 16px 20px">
                            <p
                              class="vx-error-label"
                              style="
                                margin: 0 0 4px 0;
                                font-size: 11px;
                                font-weight: 600;
                                letter-spacing: 0.02em;
                                text-transform: uppercase;
                                color: #f87171;
                              "
                            >
                              Détail de l'erreur
                            </p>
                            <p
                              class="vx-error-text"
                              style="
                                margin: 0;
                                font-size: 13px;
                                line-height: 1.6;
                                color: #fca5a5;
                                word-break: break-word;
                              "
                            >
                              {{error}}
                            </p>
                          </td>
                        </tr>
                      </table>

                      <!-- CTA -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="margin: 0 auto"
                      >
                        <tr>
                          <td
                            class="vx-btn-bg"
                            style="
                              border-radius: 999px;
                              background-color: #f5f5f5;
                            "
                          >
                            <a
                              href="{{app_url}}"
                              class="vx-btn vx-btn-fg"
                              target="_blank"
                              style="
                                display: inline-block;
                                padding: 15px 36px;
                                font-size: 15px;
                                font-weight: 600;
                                color: #121212;
                                text-decoration: none;
                                border-radius: 999px;
                              "
                            >
                              Relancer un rendu
                            </a>
                          </td>
                        </tr>
                      </table>

                      <!-- <p
                        class="vx-muted-dim"
                        style="
                          margin: 16px 0 0 0;
                          font-size: 12px;
                          color: #6e6e6e;
                        "
                      >
                        Le problème persiste ? Réponds à cet e-mail, on t'aide.
                      </p> -->
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="center"
                style="padding: 32px 24px 0 24px"
              >
                <p
                  class="vx-muted"
                  style="margin: 0 0 6px 0; font-size: 13px; color: #a3a3a3"
                >
                  <a
                    href="{{app_url}}"
                    class="vx-link vx-fg"
                    style="
                      color: #f5f5f5;
                      font-weight: 600;
                      text-decoration: none;
                    "
                    >Vexia</a
                  >
                </p>
                <p
                  class="vx-muted-dim"
                  style="margin: 0; font-size: 11px; color: #6e6e6e"
                >
                  Référence : {{job_id}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
