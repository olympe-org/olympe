# version: "3.8"

services:
  caddy: # -> Reverse proxy with automatic HTTPS
    image: caddy:2
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  artemis: # -> Scaper
    build: ./artemis
    container_name: olympe-artemis
    volumes:
      - artemis-code:/code-artemis # to access the cloned Artemis code and its requirements.txt
      - ./artemis/collections:/app/collections # to write/read JSON locally

  athena: # -> Postgres DB
    image: postgres:16-alpine
    container_name: olympe-athena
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./athena/pgdata:/var/lib/postgresql/data
      - ./athena/initdb:/docker-entrypoint-initdb.d # auto schema on first start
    # ports:
    #   - "5432:5432" # to connect locally without docker exec // only local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  owl: # -> ingest into DB
    build: ./owl
    container_name: olympe-owl
    depends_on:
      athena:
        condition: service_healthy # waits for Postgres to be ready
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRACKS_PATH: /data/collections/billion-club/tracks
      ARTISTS_PATH: /data/collections/billion-club/artists
      TZ: Europe/Paris
    volumes:
      - ./artemis/collections:/data/collections:ro # read-only: JSON produced by artemis
    restart: unless-stopped

  heracles: # -> scripts manager
    build: ./heracles
    container_name: olympe-heracles
    depends_on:
      - artemis # needs Artemis code/outputs
      - owl # ensures Owl is started before doing `docker exec`
    volumes:
      - artemis-code:/code-artemis
      - ./artemis/collections:/app/collections
      - /var/run/docker.sock:/var/run/docker.sock # required to run `docker exec` into owl
      # - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock # <-- macOS fix -> remove pour linux
    restart: unless-stopped

  hermes: # -> API
    build: ./hermes
    container_name: olympe-hermes
    depends_on:
      athena:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRACKS_PATH: /data/collections/billion-club/tracks
      ARTISTS_PATH: /data/collections/billion-club/artists
    # ports:
    #   - "8000:8000" # Swagger: http://localhost:8000/docs // only for local
    restart: unless-stopped

  privoxy: # -> Pont HTTP -> SOCKS5 pour que ffmpeg passe par le proxy résidentiel (Raspberry Pi)
    build: ./privoxy
    container_name: olympe-privoxy
    environment:
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    restart: unless-stopped

  orphee: # -> Orphée — génération automatique de vidéos musicales
    build: ./orphee
    container_name: olympe-orphee
    depends_on:
      athena:
        condition: service_healthy
      privoxy:
        condition: service_started
    env_file: .env
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_ROOT: /storage/jobs
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      FFMPEG_HTTP_PROXY: http://privoxy:8118
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-notifications@vexia.studio}
      APP_URL: ${APP_URL:-https://vexia.studio}
      API_URL: ${API_URL:-https://orphee.olympe.center}

    volumes:
      - orphee-storage:/storage
      - ./orphee/yt-dlp-cache:/root/.cache/yt-dlp
    ports:
      - "8001:8000" # Swagger: http://localhost:8001/docs // only for local
    restart: unless-stopped

  sisyphe:
    build: ./sisyphe
    container_name: olympe-sisyphe
    depends_on:
      - heracles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # allows sisyphe to run docker exec

volumes:
  artemis-code:
  caddy_data:
  caddy_config:
  orphee-storage:
